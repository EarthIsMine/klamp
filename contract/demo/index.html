<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klamp 대표 풀 조회</title>
<style>body{font:16px system-ui;max-width:850px;margin:48px auto;padding:0 20px;background:#fafafa;color:#182127}input,textarea,button{font:inherit;padding:10px;box-sizing:border-box}input,textarea{width:100%;margin:6px 0 20px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:20px}label{display:block}small{color:#555}</style>
<h1>Klamp 대표 풀 조회</h1><p>대표 풀 기록과 후보 경로 정보를 비교합니다. 풀의 안전성·유동성이나 실제 거래 calldata를 검증하는 데모는 아닙니다.</p>
<form id="form"><label>런칭 토큰 주소<input id="token" required></label><label>후보 경로 (분할 경로별 hop 배열)<textarea id="routes" rows="10" required></textarea></label><button id="check">조회 및 비교</button></form>
<p id="status" role="status">로컬 배포 정보를 불러오는 중</p><pre id="result"></pre>
<script type="module">
const token=document.querySelector('#token'),routes=document.querySelector('#routes'),status=document.querySelector('#status'),result=document.querySelector('#result'),button=document.querySelector('#check');
try {const c=await fetch('/api/config').then(r=>r.json());token.value=c.token;routes.value=JSON.stringify([[{chainId:String(c.chainId),poolManager:c.poolManager,poolId:c.poolId,tokenIn:c.token,tokenOut:'0x0000000000000000000000000000000000000000'}]],null,2);status.textContent='대표 풀 검증 모드 · 조회 준비 완료';}catch{status.textContent='배포 정보를 읽지 못했습니다.';}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;try{const r=await fetch('/api/check',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token.value,branches:JSON.parse(routes.value)})});const v=await r.json();if(!r.ok)throw Error(v.error);const labels={registered:'대표 풀 등록됨',not_registered:'대표 풀 미등록',lookup_failed:'조회 실패 · 재시도 가능'};const blocked={'invalid-route':'경로에 이 토큰을 거치는 hop이 없음 (tokenIn/tokenOut 확인)',not_registered:'대표 풀 기록이 없어 비교할 수 없음',lookup_failed:'조회 실패로 비교할 수 없음'};const c=v.comparison;const why=c.status==='match'?' · 후보 경로 일치':c.status==='mismatch'?` · 지정 대표 풀과 다름 (분할 경로 ${c.branch+1}, hop ${c.hop+1}) · 진행 차단`:` · 진행 차단: ${blocked[c.reason]??c.reason}`;status.textContent=labels[v.canonical.status]+(v.canonical.status==='lookup_failed'?` (${v.canonical.reason})`:'')+why;result.textContent=JSON.stringify(v,null,2);}catch(err){status.textContent='입력 또는 조회 오류: '+err.message;result.textContent='';}finally{button.disabled=false;}});
</script></html>
