<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klamp Canonical Pool Lookup</title>
<style>body{font:16px system-ui;max-width:850px;margin:48px auto;padding:0 20px;background:#fafafa;color:#182127}input,textarea,button{font:inherit;padding:10px;box-sizing:border-box}input,textarea{width:100%;margin:6px 0 20px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:20px}label{display:block}small{color:#555}</style>
<h1>Klamp Canonical Pool Lookup</h1><p>Compares the canonical pool record with candidate route info. This demo does not verify pool safety or liquidity, or actual trade calldata.</p>
<form id="form"><label>Launch token address<input id="token" required></label><label>Candidate routes (hop array per split route)<textarea id="routes" rows="10" required></textarea></label><button id="check">Look up and compare</button></form>
<p id="status" role="status">Loading local deployment info</p><pre id="result"></pre>
<script type="module">
const token=document.querySelector('#token'),routes=document.querySelector('#routes'),status=document.querySelector('#status'),result=document.querySelector('#result'),button=document.querySelector('#check');
try {const c=await fetch('/api/config').then(r=>r.json());token.value=c.token;routes.value=JSON.stringify([[{chainId:String(c.chainId),poolManager:c.poolManager,poolId:c.poolId,tokenIn:c.token,tokenOut:'0x0000000000000000000000000000000000000000'}]],null,2);status.textContent='Canonical pool check mode · Ready to look up';}catch{status.textContent='Could not read deployment info.';}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;try{const r=await fetch('/api/check',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token.value,branches:JSON.parse(routes.value)})});const v=await r.json();if(!r.ok)throw Error(v.error);const labels={registered:'Canonical pool registered',not_registered:'Canonical pool not registered',lookup_failed:'Lookup failed · retry possible'};const blocked={'invalid-route':'No hop in the route passes through this token (check tokenIn/tokenOut)',not_registered:'No canonical pool record, cannot compare',lookup_failed:'Lookup failed, cannot compare'};const c=v.comparison;const why=c.status==='match'?' · Candidate route matches':c.status==='mismatch'?` · Differs from the declared canonical pool (split route ${c.branch+1}, hop ${c.hop+1}) · Blocked`:` · Blocked: ${blocked[c.reason]??c.reason}`;status.textContent=labels[v.canonical.status]+(v.canonical.status==='lookup_failed'?` (${v.canonical.reason})`:'')+why;result.textContent=JSON.stringify(v,null,2);}catch(err){status.textContent='Input or lookup error: '+err.message;result.textContent='';}finally{button.disabled=false;}});
</script></html>
