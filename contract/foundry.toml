[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
evm_version = "cancun"
# ENSv2 Beta implementations are =0.8.25 (script/EnsArtifacts.sol); the registrar must match the Sepolia deployment (0.8.26).
compilation_restrictions = [{ paths = "src/**", version = "=0.8.26" }]
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false
# Sepolia fork tests need network: run them with FOUNDRY_PROFILE=fork forge test
no_match_path = "test/*Fork.t.sol"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 256

[lint]
lint_on_build = false

[profile.fork]
match_path = "test/*Fork.t.sol"
no_match_path = "test/__none__"

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
