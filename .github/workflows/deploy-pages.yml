name: Deploy web and dex to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "dex/**"
      # dex bundles these directly (Vite aliases)
      - "contract/sdk/**"
      - "contract/demo/sepolia/klamp-sdk.mjs"
      - "contract/deployments/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: web
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Build static site
        working-directory: web
        run: pnpm build

      - name: Install dex dependencies
        working-directory: dex
        run: pnpm install --frozen-lockfile

      - name: Build dex
        working-directory: dex
        run: pnpm build

      # One Pages site per repository: dex is served at /dex/ next to the web export.
      - name: Add dex under /dex/
        run: cp -r dex/dist web/out/dex

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
